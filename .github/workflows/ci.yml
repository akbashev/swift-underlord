# Builds and tests on Linux x86-64 (where the SHA-NI, PCLMULQDQ and VPCLMULQDQ paths run, if the runner's CPU has
# them) and on Linux arm64, with Swift 6.4.2 installed by scripts/install-swift.sh (which this checks too).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.4.2, through the install script
        run: sudo SWIFT_VERSION=6.4.2 bash scripts/install-swift.sh
      - name: the CPU
        run: |
          lscpu | grep -E 'Model name|Architecture'
          echo "features: $(grep -o -w -E 'sha_ni|pclmulqdq|avx512f|vpclmulqdq' /proc/cpuinfo | sort -u | xargs)"
      - name: test (debug)
        timeout-minutes: 15
        run: swift test
      - name: test (release)
        timeout-minutes: 15
        run: swift test -c release -Xswiftc -enable-testing
      - name: test (portable only, no X86Extensions trait)
        timeout-minutes: 15
        run: swift test --disable-default-traits
