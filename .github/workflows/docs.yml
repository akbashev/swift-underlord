# Builds the documentation site on Linux (EventLoop and IORing are Linux-only) on every push and pull request, and
# publishes it to GitHub Pages from main: https://akbashev.github.io/swift-underlord/
name: docs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.4.2 with DocC
        run: sudo SWIFT_VERSION=6.4.2 SWIFT_FULL=1 bash scripts/install-swift.sh
      - name: the site
        run: bash scripts/build-docs.sh .build/site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with: { path: .build/site }

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    concurrency: { group: pages, cancel-in-progress: true }
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
